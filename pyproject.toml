[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smearglepaper"
version = "0.2.0"
description = "OpenMuse: a recoverable AIGC Harness with portable Skills, research-to-article workflows, and reviewable WeChat drafts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "GetIT-Sunday" }
]
keywords = ["arxiv", "papers", "wechat", "mcp", "llm", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "requests>=2.31.0",
  "certifi>=2024.0.0",
  "cryptography>=42.0.0",
  "PyYAML>=6.0.1",
  "markdown>=3.6",
  "pypdf>=4.2.0",
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0.0",
  "textual>=0.80.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9.0"]
dev = [
  "build>=1.2,<2",
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "mcp==1.9.4",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "pre-commit==3.8.0",
]

[project.scripts]
smearglepaper = "smearglepaper.cli:main"
openmuse = "smearglepaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smearglepaper*", "mcp_server*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
include = [
  "scripts/check_release.py",
  "tests/test_stage8_release.py",
  "scripts/evaluate_harness.py",
  "scripts/eval_support/*.py",
  "tests/test_stage7_*.py",
  "src/smearglepaper/conversation.py",
  "src/smearglepaper/context_budget.py",
  "src/smearglepaper/preference_memory.py",
  "src/smearglepaper/preference_ui.py",
  "tests/test_stage6_memory.py",
  "src/smearglepaper/turn_store.py",
  "tests/test_stage5_recovery.py",
  "tests/test_conversation.py",
  "src/smearglepaper/providers.py",
  "src/smearglepaper/cancellation.py",
  "src/smearglepaper/harness.py",
  "src/smearglepaper/harness_events.py",
  "src/smearglepaper/harness_projection.py",
  "tests/test_stage3_harness.py",
  "src/smearglepaper/runtime/**/*.py",
  "src/smearglepaper/cli.py",
  "src/smearglepaper/tui.py",
  "src/smearglepaper/session.py",
  "src/smearglepaper/renderer.py",
  "src/smearglepaper/workflow_engine.py",
  "src/mcp_server/server.py",
  "tests/test_runtime.py",
  "tests/test_runtime_workflows.py",
  "tests/test_cli_runtime.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/smearglepaper/runtime", "src/smearglepaper/conversation.py", "src/smearglepaper/providers.py", "src/smearglepaper/cancellation.py", "src/smearglepaper/harness.py", "src/smearglepaper/harness_events.py", "src/smearglepaper/harness_projection.py", "src/smearglepaper/context_budget.py", "src/smearglepaper/turn_store.py", "src/smearglepaper/preference_memory.py", "src/smearglepaper/preference_ui.py"]
explicit_package_bases = true
follow_imports = "skip"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
