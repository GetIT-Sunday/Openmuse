name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest -q --cov=smearglepaper --cov-report=term-missing
      - name: Offline Harness acceptance
        run: python scripts/evaluate_harness.py --output artifacts/harness-eval
      - name: Upload Harness acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-acceptance-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            artifacts/harness-eval/*/report.json
            artifacts/harness-eval/*/report.md
          if-no-files-found: warn
      - name: Build wheel from source distribution
        run: python -m build --outdir dist/candidate
      - name: Inspect and independently install release candidate
        run: python scripts/check_release.py --dist dist/candidate
      - name: Upload tested release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: dist/candidate/*
          if-no-files-found: error
      - name: Upload packaging failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: dist/candidate/release-check.json
          if-no-files-found: ignore
